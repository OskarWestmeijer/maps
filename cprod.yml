services:
  maps:
    image: oskarwestmeijer/maps:${MAPS_IMAGE_TAG:-latest}
    container_name: maps
    deploy:
      resources:
        limits:
          memory: 100m
        reservations:
          memory: 100m
    expose:
      - '80'
      - '443'
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Refreshed statistics, written by scripts/fetch_statfi.py on a cron (see
      # .github/workflows/refresh-data.yml). nginx serves these in preference to the copy
      # baked into the image, so new figures reach the site without a rebuild. Read-only:
      # the container consumes them, the host writes them.
      - ./data:/srv/live/data:ro
    labels:
      log_category: 'nginx'

networks:
  default:
    name: proxy
    external: true
