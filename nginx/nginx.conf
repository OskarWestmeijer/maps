events {
    worker_connections 1024;
}

http {

    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'x_request_id=$http_x_request_id '
                    'host=$host '
                    'uri=$request_uri';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # applies to ALL responses in this server
        add_header X-Request-Id $http_x_request_id always;

        # SvelteKit's adapter-static uses trailingSlash: 'never', so canonical
        # pages are emitted as e.g. interactive.html, not interactive/index.html.
        # The gallery/[slug] routes also produce a same-named "gallery"
        # directory with no index.html in it. Without this normalization, a
        # trailing-slash request resolves to that directory and 403s before
        # try_files ever reaches the SPA fallback.
        rewrite ^/(.+)/$ /$1 permanent;

        # The statistics the interactive maps fetch on load. Unlike everything else here they
        # are *not* baked into the page: scripts/fetch_statfi.py rewrites them on a cron and
        # the next page load picks them up, with no rebuild and no redeploy.
        #
        # Two roots, in order: the host directory the compose file mounts (what the cron
        # writes), then the copy shipped inside the image. That ordering is what makes an
        # empty or missing mount harmless — the maps fall back to the vintage they were built
        # with instead of going blank.
        location /data/ {
            root /srv/live;
            try_files $uri @baked_data;
            add_header Cache-Control "no-store" always;
            add_header X-Request-Id $http_x_request_id always;
        }

        location @baked_data {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
            add_header X-Request-Id $http_x_request_id always;
        }

        location / {
            try_files $uri $uri.html /index.html;
        }

        location /health {
            default_type text/plain;
            return 200 'nginx-maps routing works trace=$http_x_request_id';
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}